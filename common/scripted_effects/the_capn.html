<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL // Management System</title>
<style>
  :root {
    --bg: #0a0e0a;
    --panel: #0f140f;
    --border: #1f3a1f;
    --green: #33ff66;
    --green-dim: #1c8a3a;
    --amber: #ffb000;
    --red: #ff4444;
    --text: #aaffaa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    line-height: 1.5;
    padding: 20px;
    min-height: 100vh;
  }

  /* subtle CRT scanline overlay */
  body::after {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.15) 3px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 0 25px rgba(51,255,102,0.07);
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header .title {
    color: var(--green);
    text-shadow: 0 0 8px rgba(51,255,102,0.4);
    letter-spacing: 2px;
    font-weight: bold;
  }

  .money {
    color: var(--amber);
    text-shadow: 0 0 8px rgba(255,176,0,0.4);
    font-size: 18px;
  }

  .money .label { color: var(--green-dim); font-size: 12px; }

  nav {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    color: var(--green-dim);
    font-family: inherit;
    font-size: 14px;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn:hover { color: var(--green); background: rgba(51,255,102,0.05); }
