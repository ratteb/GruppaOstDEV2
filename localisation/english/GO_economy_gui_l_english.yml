 GO_ECON_GUI_GDP_DETAILS:0 "§HNational GDP§!\nNominal: [GetGOEconomyGDP]\nReal, constant 2027 prices: [GetGOEconomyRealGDP]\nReal GDP per person: [GetGOEconomyGDPPerCapita] reference USD\n[GetGOEconomyCoverage]\n\nOnly owned and controlled states contribute. Missing state data prevents a complete national total. These are saved reports. Local-currency display is not connected yet."
 GO_ECON_GUI_FISCAL_DETAILS:0 "§HIncome and Expenditure§!\n[GetGOEconomyFiscalStatus]\n[GetGOEconomyReportSpan]\n\nIncome: [GetGOEconomyReceipts]\nGovernment Services: [GetGOEconomyServices]\nDevelopment spending: [GetGOEconomyCapitalSpending]\nCapital refunds: [GetGOEconomyCapitalRefunds]\nTotal expenditure after refunds: [GetGOEconomyExpenses]\n[GetGOEconomyDeficit]\nBorrowed funds: [GetGOEconomyFinancing]\n\nReference USD billions. Borrowing finances payments; it is not income. Refunds reduce previously recorded development spending. The report covers supported Services and development accounts, not every part of a government budget."
 GO_ECON_GUI_PU_DETAILS:0 "§HProduction Units§!\n[GetGOEconomyPUCapacity]\nEffective: [GetGOEconomyPUAllocation]\nRequested: [GetGOEconomyPendingCivil] civilian / [GetGOEconomyPendingMilitary] military\n\nFactory slots queue a new allocation for the next successful monthly update. They do not immediately grant factories. Geopolitical status limits usable capacity. Civilian factories remain subject to native consumer-goods and trade reservations. Energy and starting-factory migration are not connected yet."
