 GO_ECON_GUI_GDP_INCOME_PREVIEW_DETAILS:0 "§HNext monthly GDP income · estimate§!\n[GetGOEconomyGDPIncomePreview]\nCalculated on recorded day [?GO_econ_country_gdp_income_preview_day|0].\n\nCurrent annual real GDP × price index × configured annual income share, divided by months per year. The rate is editable fictional gameplay calibration. GDP is economic output, not money already in the treasury. This estimate is not a payment; the normal monthly settlement must pass all fiscal and state-coverage guards before crediting income."
