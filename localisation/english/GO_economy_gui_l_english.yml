 GO_ECON_GUI_RESERVE_FUEL_DETAILS:0 "§HNative fuel reserve§!\nStock: [GetGOReserveFuel]\nCapacity: [GetGOReserveFuelCapacity]\n\nLive engine-managed fuel in thousands, separate from raw oil availability. This screen only reads native data. No custom fuel production or compatibility conversion is implemented."
 GO_ECON_GUI_RESERVE_AMMUNITION_DETAILS:0 "§HAmmunition reserve§!\n[GetGOReserveAmmunitionState]\n[GetGOReserveAmmunitionDate]\nStock: [GetGOReserveAmmunition]\nCapacity: [GetGOReserveAmmunitionCapacity]\nLast daily gross gain: [GetGOReserveAmmunitionGain]\nLast daily consumption: [GetGOReserveAmmunitionConsumption]\n\nAll quantities are thousands of ammunition. The existing ammunition account is authoritative. Assigned plants allocate steel; fixed output enters outside the legacy gain multiplier. Gross gain differs from net stock change after consumption and capacity clamping. A negative recorded stock is a deficit, not a second inventory."
 GO_ECON_GUI_RESERVE_FOOD_DETAILS:0 "§HFood reserve and production§!\nStored food: [GetGOReserveFood]\n\nCompleted food-production capacity: [GetGOFoodProductionCapacity]\n[GetGOFoodProductionCapacityDate]\nLast building receipt: [GetGOFoodProductionOutput]\nRecorded production basis: [GetGOFoodProductionReportBasis]\nLatest production attempt: [GetGOFoodProductionAttempt]\n[GetGOFoodProductionAttemptDate]\n\nLast external receipt: [GetGOReserveFoodReceipt]\n[GetGOReserveFoodReceiptDate]\n\nBuilding output and external supply enter the same guarded food reserve through separate receipt paths. A receipt is not the current reserve balance. Historical receipts retain their recorded days, even if later production is unavailable. Physical capacity alone does not imply a receipt; the food reserve must be configured. Food uses abstract stored units. Rations production is not implemented."
