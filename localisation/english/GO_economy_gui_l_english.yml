 GO_ECON_GUI_Microchips_DETAILS:0 "§HMicrochips · custom availability§!\n[GetGOMaterialMicrochipsDate]\nSupply source: [GetGOMaterialMicrochipsSource]\nExternal supply: [GetGOMaterialMicrochipsExternal]\nCustom processing output: [GetGOMaterialMicrochipsOutput]\nTotal supply: [GetGOMaterialMicrochipsTotal]\nRequested custom demand: [GetGOMaterialMicrochipsDemand]\nUsed by custom recipes: [GetGOMaterialMicrochipsAllocation]\nRemaining available: [GetGOMaterialMicrochipsAvailable]\nUnfilled requests: [GetGOMaterialMicrochipsUnmet]\nSupply shortage: [GetGOMaterialMicrochipsShortage]\n[GetGOMaterialMicrochipsCoverage]\n\nSupply comes only from committed output of assigned semiconductor factories. State deposits, native-surplus sampling, starting balances and external grants do not supply this material. Abstract recurring units do not carry over as an industrial stock. Coverage concerns implemented custom recipes only; missing or incomplete reports remain unavailable. Custom output is not added to native factory or trade supply."
