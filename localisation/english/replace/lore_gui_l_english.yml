 mod_loc: "§2Gruppa Ost: Pobeda Za Nami:§! Version 0.1 §9"The Double Headed Eagle"§!\n\nHello and thank you for trying our BETA mod! Please feel free to take a look and try out the mod. As we've worked long and tirelessly to develop this mod for its first BETA release, i'd like to share what me and my team so far have created for you to enjoy.\n\nYears of playable custom content for:\nRussian Federation\nUnited States of America\nPeople's Republic of China\nUkraine\nFrance\nNovorossiya\n\nWith multiple paths and storylines, we've also reworked the entire tech tree, the map, and the way combat works! However since this is our first BETA release, a lot of our planned content has been stalled to later releases, if you wish to see these sooner, please apply to become a developer!"
