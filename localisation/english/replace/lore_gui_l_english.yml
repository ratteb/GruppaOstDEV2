 SOV_opening_screen_2000_chapter_0_title:  "The Looting of Russia"
 SOV_opening_screen_2000_chapter_0_desc:   "December 26th, 1991, the §RUSSR§! has officially dissolved, and with §CYeltsin§! at the helm, free market reforms don't seem very far away. However, despite the promises, the so called "Shock Therapy" was not meant to save Russia, it was meant to destroy it. The idea behind Shock Therapy was to give everyone large stocks in the many old state owned corporations of the old Union. However, many people were unfamiliar with stocks, and didn't know how much these vouchers were truly worth. And so a small group started to form, who would cheaply buy up all the brokerage vouchers.\n\n§5The Oligarchs§! have been formed. §5The Oligarchs§! have long been an intense thorn in the side of modern Russia, however in the 1990s they practically ran things. §CYeltsin§! was loyal to them, and they owned all the capital in the country, and have begun systematically looting it. And with §CYeltsin§! being loyal to a small rich group of industry owners. §9The Supreme Soviet§! had decided to impeach §CYeltsin§! over the Shock Therapy policy.\n\nIn 1993, §CYeltsin§! would commit the so called Black October, of Russia. After the §9Supreme Soviet§! had decided to impeach §CYeltsin, Yeltsin§! would commit to storming the §9Supreme Soviet§! with tanks, and special police forces §OOMON§! and §OSOBR§!. Soon following rewriting the constitution to give the presidency extroardinarily more powers.\n\nSoon after §CYeltsin§! had positioned himself as untouchable from inner resistance, the §GFirst Chechen War§! would begin, to retake the §7Chechen Republic§! which has been held by seperatists for a good amount of time now. As this war would end in a stalemate with heavy Russian losses, and a trauma that has held, this would spell the end for §CYeltsin's§! future career, and would bring to the rise of another ideology."

