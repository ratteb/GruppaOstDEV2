 USA_border.2.t: "Failure of the Wall Project"

 USA_border.4.t: "Patriot Front Marches in Houston"
 USA_border.4.d: "Following our decision to use AIPAC donations to fund the construction of the wall (which if completed in turns helps the GOP's political campaign) Far Right Anti Israeli Group, Patriot Front. Has decided to organize a march and protest against the decision. Statements from Thomas Rousseau mention that: "A project meant to protect the American people from illegal immigrants is being actively funded by the nation state orchestrating a majority of these migrant waves."\n\nAlthough their claims remain largely unfounded, the march got heavy news coverage and it has significantly boosted the visibility of the Patriot Front, especially in the Deep South and Texas. The march was attended by atleast 30 confirmed Patriot Front members, but there were hundreds not officially affiliated with the group attending and participating in the march.\n\nNo casualties fell despite the large crowds and inflammatory statements, the group also does not pose a threat to the project as of now. The NSA will continue monitoring and assessing the situation to see if a need for strategical redirection is needed."
 USA_border.4.a: "Noted."
