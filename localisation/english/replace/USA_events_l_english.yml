 USA_trump.1.t: "The January Rally"
 USA_trump.1.d: "He looked to the clock and then to his aides. The music boomed through the stadium and the lights were bright. Donald J. Trump stepped up to the podium like he always did at these events. Yet, this time felt better than others, he was happy and ready for this year. The stadium was filled with droves of his supporters. He could see the signs, the flags, the hats, and the waves. He heard the cheers and shouts and then he opened his mouth: 'Folks, the last three years, absolutely tremendous. Unbelievable. But let me tell you, this last year? It's going to be even better, believe me. We’ve got the greatest economy in the world, nobody's even close. Our military? It's going to be the best again, and I mean the best. Before this year is over, America will be truly great again, folks. You’ll see. It’s going to be huge. Im glad to have every single one of you patriots here. I'd like to thank you all for your impeccable support. You know, it's great really.' Trump said looking out at the crowds. Who then erupted into applause. The past three years have been a whirlwind of achievements, setbacks, and relentless effort. Now, in his final year, he is more determined than ever to cement his legacy. However he does that though, is to be seen."
 USA_trump.1.a: "One more year!"

