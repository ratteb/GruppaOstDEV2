 LOADING_TIP_0: "Nobody and nothing will stop Russia on the road to strengthening democracy and ensuring human rights and freedoms.\n- Vladimir Putin"
 LOADING_TIP_1: "Terrorists are always a threat to someone. If we'll be scared of them, it means they have won.\n- Vladimir Putin"
 LOADING_TIP_2: "You know, there’s a uh, during World War II, uh, you know, where Roosevelt came up with a thing uh, that uh, you know, was totally different than a, than the, the, it’s called, he called it the, you know, the World War II, he had the war – the War Production Board\n- Joe Biden"
 LOADING_TIP_3: "China will always remain the builder of world peace, a contributor to global development, and upholder of international order.\n- Xi Jinping"
 LOADING_TIP_4: "Keep alive the truth and honor of the Holocaust.\n- Joe Biden"
 LOADING_TIP_5: "If you're going to be thinking, you may as well think big.\n- Donald Trump"  
 LOADING_TIP_6: "Giraffes are heartless creatures"
 LOADING_TIP_7: "Russia made a decisive contribution to the victory over Nazism. That's clear to every honest observer. So, therefore, in a certain manner, it is indeed part of the country's national psyche.\n- Dmitry Medvedev"
 LOADING_TIP_8: "If there is no Ukrainian strong army, there will be no Ukraine, and that will be the case when everyone will understand... it's not the war in Ukraine, it's the war in Europe. We are defending our country, our land. We are not attacking anyone, because that is immoral.\n- Vladimir Zelenskiy"
 LOADING_TIP_9: "I don't want to interfere in U.S. elections.\n- Volodymyr Zelenskyy"
 LOADING_TIP_10: "And I would like to say: Glory to Ukraine, and I hope everything will be fine in my country. \n- Viktor Yanukovych"
 LOADING_TIP_11: "I would like to say that I am alive, although I cannot say that I feel very well, because I feel a deep and profound concern over what is happening in Ukraine now. Disguised behind a veneer of an allegedly legitimate government, there is a gang of ultranationalists and fascists now acting in Ukraine involving people who are now aspiring to presidential office.\n- Viktor Yanukovych"
 LOADING_TIP_13: "I think Russia should, and is obliged, to act, and knowing the character of Vladimir Vladimirovich Putin, I am surprised he is so restrained and keeping silent.\n- Viktor Yanukovych"
 LOADING_TIP_14: "Those who embarked on the path of violence, bloodshed, lawlessness did not recognize and do not recognize any other solution to the Donbass issue, except for the military one. In this regard, I consider it necessary to take a long overdue decision to immediately recognize the independence and sovereignty of the Donetsk People's Republic and the Luhansk People's Republic.\n- Vladimir Putin"
 LOADING_TIP_15: "If Ukraine was to join NATO it would serve as a direct threat to the security of Russia.\n- Vladimir Putin"
 LOADING_TIP_16: "We are not separatists, we are patriots of Donbass. We are fighting not against Ukraine but against a regime that has betrayed its people.\n- Pavel Gubarev"
 LOADING_TIP_17: "The world is a mess. The world is as angry as it gets. What, you think this is going to cause a little more anger? The world is an angry place.\n- Donald Trump"
 LOADING_TIP_18: "The Donbas is Ukrainian. The people of Donbas will never be Russian, even if they are forced to endure this nightmare. The unity of Ukraine is what will win in the end.\n- Yulia Tymoshenko"
 LOADING_TIP_19: "Americanism, not globalism.\n- Donald Trump"
 LOADING_TIP_20: "Every day, we wake up not knowing if we will see tomorrow. This war has made us all refugees in our own homes.\n- Unknown Civilian in the Donbass"
 LOADING_TIP_21: "My election only proves that the citizens are tired of the experienced politicians who over the past 28 years created a country of opportunities - opportunities to steal, bribe and loot.\n- Volodymyr Zelensky"
 LOADING_TIP_22: "Fight, Fight, Fight!\n- Donald Trump"
 LOADING_TIP_23: "I think every person should have some faith inside him, in his heart. What matters is not an external display of this faith, but the inner state of the soul.\n- Vladimir Putin"
 LOADING_TIP_24: "Peace is purchased from strength. It's not purchased from weakness or unilateral retreats.\n- Benjamin Netanyahu"
 LOADING_TIP_25: "Peace is not absence of conflict, it is the ability to handle conflict by peaceful means.\n- Ronald Reagan"
 LOADING_TIP_26: "Strong families lead to strong nations..\n- Recep Tayyip Erdogan"
 LOADING_TIP_27: "I'll drown in this city of broken hopes, Only shadows from dreams behind me. I can only imagine a better day in a dream, I'm doomed to die here alone.\n- Lyric from Місто розбитих надій"
 LOADING_TIP_28: "The first time I ever saw a jet, I shot it down.\n- Chuck Yeager, USAAF"
 LOADING_TIP_29: "Your name is unknown. Your deed is immortal.\n- Tomb of the Unknown Soldier (Moscow)"