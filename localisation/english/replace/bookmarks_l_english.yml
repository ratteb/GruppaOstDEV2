 TDHEHW_NAME:0 "The Double Headed Eagle Has Won!"
 TDHEHW_DESC:0 "The year is 2027 and the World Order has practically changed, the United States as the Unipolar master of the world has passed, with it losing the war in Ukraine, with the failure of the Armed forces, and popular support, when Zelenskyy narrowly avoided death and fled to the United States, the war was officially over for Ukraine. With Donald Trump sworn in for office only months prior to the event, he was blamed for the mismanagement and loss of a valuable ally to the United States.\n\nAnd now, the tri colour flag flew over Kharkov, Donetsk, Lugansk, Zhaporozhye, And Odessa. As Russia attempts to solidify its control over the region, partisans run wild, with the central government having a lack of control on its subjects, and much rebuilding needing to be done, and right over the most militarized and tense border in the world, Ukraine was in chaos, a huge political crisis, with an unloyal Parliament, a full blown insurgency wrecking havoc on the lives of thousands, President of Ukraine Palytsia is forced to steer the ship in a right direct, lest he fails and Ukraine falls in ruin.\n\nIn Europe, the crisis with the cartels is only getting much worse, with immigration laws having not laxed much, and failed measures to increase security at the port, cartels see Europe as the prime market for cocaine, sickening its people, and making the streets unsafer by the day, while they only grow richer. This has caused a massive uptick in far right sentiment, with many criticising the left wing, centre right governments in charge of the European nations.\n\nOver in Asia, South Korean dictator successfully couped his own nation, in an accordance to "Rid it of North Korean Influence" he comitted widespread purges, and deployed the Special Forces on the streets in order to quell any dissident against his rule, and while he has established himself for now, things will only get worse, as North Korea prepares to re arm itself, using the combat experience gained in Ukraine."