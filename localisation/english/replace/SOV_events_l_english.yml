 SOV_gerasimov.2.a: "The GRU? Really?"

 # Shoigu Events
 SOV_shoigu.1.t: "The Traditionalist"
 SOV_shoigu.1.d: "It was a sunny midday in Yekaterinburg and 3 men, dressed in extravagant military uniforms, with shiny polished shoes and medals were walking among numerous T-90M tanks with the crews standing in upright still positions saluting the 3 men, who were these 3 men? General Sergei Surovikin, Colonel General Alexander Lapin, and General Sergei Shoigu. Arguably the 3 most important men in the 'Old Guard' faction within the Ministry of Defence. As Shoigu was walking by the tanks of the 1st Guards Tank Regiment he became pleased and turned to Surovikin: "You know General, if it was not for Gerasimov and his illogical ideas for the Armed Forces, we could have more grand shows like this, massive armed formations, tanks, and firepower that the United States could never match." Surovikin chuckled and said: "It is a shame he got so much more influential after the Special Military Operation, Vladimirovich has his favour now but i know of a way we can reverse this." Shoigu looked interested and slightly lifted his eyebrows: "How is that?" Surovikin quickly replied "Let's discuss in my office, it will be a bit more private."\n\nAfter some time, they finally reached the office, Surovikin poured out 3 glasses of champagne and handed it to Shoigu and Lapin. "You ask, how can we reverse the favour Gerasimov has received? It is simple, we must make Vladimirovich aware of the political reality, we are a stable support base, we don't challenge him." Shoigu chuckled: "You make good points, I will have my secretary write up a document immediately that we can represent when we go to discuss this 'reform' programme. This may just be a way to further our Russian Doctrine ideals, and we can get rid of Gerasimov just as quick." Surovikin smirked at Shoigu: "You never change General.""
 SOV_shoigu.1.a: "Schemers Stay Scheming"

