 news_BLR_protest.1.t: "Order Restored in Belarus"
 news_BLR_protest.1.d: "With protests in Belarus finally reaching a breaking point, the Belarussian government had sent a plea to the Russian Federation for a "Peacekeeping Operation" However such a proposal was refused by the Russian Government. Namely due to resource constraints and active military reforms being preformed under the "Sotnik-1 Programme" either way, the Belarussian MVD and OMON were able to actively supress these protests and the reign of Lukashenko is likely secure. While public statements by Lukashenko, showing slight disappointment in the Russian resolve, relations have not meaningfully deteriorated between the 2 states. \n\n Lukashenko has however announced that reforms to the liberties of the people, MVD and OMON will commence in the near future."
 news_BLR_protest.1.a: "Thank God..."

 news_BLR_protest.2.t: "Russia Restores Order in Belarus"
 news_BLR_protest.2.d: "After the protests in Belarus began and the Belarussian government was clearly struggling to maintain these protests they had asked the Russian government for peacekeepers. Soon after Russian Peacekeepers were in all major cities including Minsk, Gomel, and Pinsk. Soon after, the protests were in a contained position and it surely assumed that Lukashenko will remain in power for much longer, albeit with a heavy reliance on Russian military and security prescense. No statements were made publicly about the furthering of the Union State Project, assuming it will continue as it has been. \n\n While Western countries have condemned this move, no public measures were taken against either Belarus or Russia, with the only noticable thing being that the border security between Poland and Belarus has been slightly more active in recent times."
 news_BLR_protest.2.a: "Russian Power Displayed Once Again"

 news_BLR_protest.3.t: "Russian Tanks Roll Down in Minsk!"
 news_BLR_protest.3.d: "After the Russian peacekeepers arrived in Belarus to help with the protests, but no slowing down being noticed, the Belarusian Government had sent a plea to the Russian Government to re establish order as soon as possible. And within 12 hours, 27 Russian Tanks and Rosvgardiya Units were spotted in the centre of Minsk occupying Police Stations and setting up barriers on the roads, soon, only 1 hour after their arrival the arrest of Protest leaders had been documented. It is safe to say, with the arrest of the protest leaders and prescense of heavy Russian Infantry that the fall of Lukashenko or his regime wont be for any time soon. As soon as this had happened the European Union and United States had condemned the move and promised an "Appropriate Response" for such a Violent takeover.\n\n It is safe to say Alexander Lukashenko will attempt to rapidly advance the Union State Program with the active involvement of Russian FSB and Security Forces in the region, which could once and for all ensure Russian control over the country."
 news_BLR_protest.3.a: "Chaos!"

 news_BLR_protest.4.t: "Russian Peacekeepers Leave Minsk!"
 news_BLR_protest.4.d: "Placeholder"
 news_BLR_protest.4.a: "Will Lukashenko Live?"

 news_BLR_protest.5.t: "New Government in Belarus"
 news_BLR_protest.5.d: "With Belarus being rocked by protests for a couple weeks now, it has finally become public by the new incumbent transitional leader of the Belarusian government that Alexander Lukashenko and many of his cabinet have left the country. Many wonder what will happen now that Lukashenko has left the government and the country is in a fresh chaos of a new government. With many wondering and worrying what the Russian response will be, the transitional leader has said this is not a time to celebrate, but prepare for any possible Russian intervention, or intervention from loyalists of the former administration. The European Union however has already congratulated Belarus, with openly hostile language against the old administration."
 news_BLR_protest.5.a: "Is it Over?"

 news_BLR_protest.6.t: "Vladimir Putin Announces Special Anti Terrorist Operation"
 news_BLR_protest.6.d: "After the revolution in Belarus, the Russian Government had been eerily silent on the matter, with Alexander Lukashenko's current whereabouts being unknown and Russian troop movements already being seen near the Belarusian borders, it was only a matter of time before Russia would launch what they called a "Special Anti Terrorist Operation" with Vladimir Putin making a televized address akin to what was seen in 2022 and Ukraine. Many see this as Putin not wanting to repeat what had happened in 2014 and immediately intervening in a neighbour falling to an Anti Russian Government. Many analysts note that the new Belarusian government, still freshly in chaos will not be able to reliably resist a Russian invasion and that even if they had rapid NATO aid, would still fall within weeks.\n\n However only time will tell how this pans out."
 news_BLR_protest.6.a: "Will This Horror Ever Stop?"

