 # Sotnik Modernization Program Events
 SOV_sotnik.1.t: "Sotnik-1 Modernization Programme"
 SOV_sotnik.1.d: "It was only 7:00 in the morning, in the Kremlin, Moscow, Vladimir Putin was sitting at the head where the daily briefings of the Ministry of Defense are held, ever since the Special Military Operation, he had seen this same room, same people, as he sat there, waiting, at 7:05 percisely everyone was there, Putin started with a sigh: 'So, how are the plans of the Modernization Programme? Are they ready? Can we commence?' At these questions, Valery Gerasimov, practically the head of the Russian Army at this point, gave an excited answer: 'Yes mister president, we are ready to commence the modernization programme, the entire plan is written out on the document in front of you, all you must do is sign and give us the budget.' something akin to a smile came onto his face, it was clear that Gerasimov was proud of the long hours of work put in this plan, yet Putin seemed, not impressed, he hasnt smiled and simply looked down at the document.\n\nAfter quickly skimming it, Putin turned to the last page and signed the document, with another sign he handed it to his secretary, the briefing didn't take long, it was boring reports about numbers of conscripts, officers, expenses and earnings, Putin was getting old and he simply couldn't bother with much of it anymore, at 7:30 it was over, and they all left the room, however Putin still had a job to do, announce the modernization program on live television for the nation to witness, with certain examples already being shown on the news sites and television: 'Dear citizens of Russia...'"
 SOV_sotnik.1.a: "Ura!"

 SOV_sotnik.2.t: "Officer Corps Purges Cause Slowdowns!"
 SOV_sotnik.2.a: "What the Hell Man!?"

 SOV_sotnik.3.t: "Officer Corps Reform Results"
 SOV_sotnik.3.a: "We Will Implement an NCO System!"
 SOV_sotnik.3.b: "We Will Continue With the Reserve Officer System"

 SOV_sotnik.4.t: "Gerasimov's Reaction"
 SOV_sotnik.4.d: "While Putin was sitting at his desk in the Kremlin, reading over some documents, suddenly one letter caught his eye 'URGENT' it said, Putin calmly opened the letter, only to read the most disgusting slew of slurs and insults ever, not directed at him however, but at the others within the Ministry of Defence, calling them a bunch of 'yesmen' who dont know anything except sucking up to the decisions of Shoigu and his band of old guardists. Simply said, Putin didn't know what to think of this.\n\nGerasimov was obviously angry at the decision to oppose him, thinking his plans were the only correct ones. While this is obviously not true, in a way Gerasimov also has a point of the others in the MOD, however they simply did not have the influence Gerasimov was claiming they had, they were nothing.\n\nPutin was the one who signed the Reserve Officer System, and Gerasimov was openly opposing it, Putin thought to remind him of his place, and silence this slimey dog, but on another part, silencing the others in the MOD might lead to a bad situation with an unloyal Ministry, that only does what he asks."
 SOV_sotnik.4.a: "Let Him Bark"
 SOV_sotnik.4.b: "Punish Him for Speaking Out"

 SOV_sotnik.5.t: "Shoigu's Reaction"
 SOV_sotnik.5.d: "He Angry!"
 SOV_sotnik.5.a: "Let Him Bark"
 SOV_sotnik.5.b: "Punish Him for Speaking Out"

 SOV_sotnik.6.t: "The Ministry of Defence Discusses The SMO"
 SOV_sotnik.6.d: "It was an early morning in Moscow, all the usual people were there, Gerasimov, Shoigu, Putin, and many other generals and highly powerful people in the Russian system. The meeting started at 08:05 sharply, and as usual Gerasimov started to speak. “Greetings, gentlemen, as a major part of the new Sotnik programme, we have asked us all to sit together and discuss the successes and failures of our Special Military Operation in Ukraine.” Gerasimov corrected his coat, and resumed to speak. “We will go over our early military successes and failures in 2022, what changed in 2023, and our newly found successes in 2024. Any questions?” Shoigu immediately spoke up in an almost disgusted tone. “Will this just be another one of your speeches glorifying yourself? Or will you be honest about your own failures too?” Gerasimov sighed and did not answer his rivals question, so he simply said: “Is that all? No more questions? Let us begin.”\n\nAnd so, this long meeting would finally begin, with this marking the point of no return of a total modernization of the Russian Armed Forces."
 SOV_sotnik.6.a: "Let's Get Going Then."

 SOV_sotnik.7.t: "The Early Successes"
 SOV_sotnik.7.d: "As the meeting began, Gerasimov opened with a graphically animated map of Ukraine and Russian advances ranging from February to March, showing large territorial gains and rapid strikes, and as such he began to speak. “Gentlemen, as you may know early in the Operation, we were able to utilize the element of surprise and combined arms to overwhelm our enemy, however even then, some noticeable strategic errors were made, mainly, the lack of a backup plan if our Air Landings at the Antonov Airport tragically failed. I feel like the early implementation of Hybrid Warfare was effective, utilizing propaganda, combined arms, and psychological operations in order to quickly capture and establish order in the South and East of Ukraine. However due to it only being half implemented, I fear that the Special Military Operation did not go as smoothly as was first expected.”\n\nShoigu immediately rose up in protest: “Scoundrel! It was the Hybrid Warfare that caused the early failures, if we stuck with conventional warfare and pure military prowess we would have had the supply chains, intimidation, and manpower to quickly capitulate the Ukrainians and free the Donbass earlier! You forced us into a 3 year war with your doctrine!” The Old Guard, sitting at Shoigu’s side of the table all silently agreed.\n\nGerasimov’s reformist side quickly countered saying: “All the military objectives in February and March were completed and successfully so! Only due to Hybrid Warfare!” A deadlock was created once again, with the 2 sides not agreeing with each other once more, with only one man being able to make a change in it.\n\nPutin opened his mouth and said:"
 SOV_sotnik.7.a: "We Succeeded in All Objectives"
 SOV_sotnik.7.b: "Okay Maybe There Were Some Hiccups"

 SOV_sotnik.8.t: "The Aftermath of Early Success"
 SOV_sotnik.8.d: "The meeting went on, it leading to 8:45 now and Gerasimov continued to the second phase of the Special Military Operation, from April to June, the retreat from Kiev, operational chaos and the early losses. Gerasimov began by opening once more: “I personally believe the largest fault for the retreats were the commanders with their old ways of thinking, and inability for field officers to apply quick decision making and relying on the reserve officer corps. An enlarged NCO corps would have led to a success in Antonov, and we would have never had to retreat from Kiev.”\n\nShoigu, as usual immediately countered: “The commanders are not at fault it was our lack of investment in large scale logistical networks! We were without ammunition or supplies, our commanders could have easily prevented the catastrophic loss if it weren’t for our lackluster investments in that department!”\n\nGerasimov countered once more: “Do you not understand!? If we had a good command structure and a decentralized NCO system we wouldn’t have had as many logistical issues! Because we would not be reliant on centralized backlogs and bureaucracy for the hell of it! Do you never think!? Throwing money at a problem will not fix it!”\n\nShoigu just sat there in anger, with once again no counter argument, Putin feeling the tension in the room, had to say something, wether that is dismissing them both, or siding with either of them."
 SOV_sotnik.8.a: "They Were Nescessary Retreats!"
 SOV_sotnik.8.b: "Logistics Were At Fault."
 SOV_sotnik.8.c: "Commanders Were At Fault"

 SOV_sotnik.9.t: "Ukrainian Counter Offensives September - November 2022"
 SOV_sotnik.9.d: "10 minutes later after the bickering had silenced Gerasimov continued to the next topic of debate. The early counter offensives by the AFU. Gerasimov opened up by saying: "While I understand the reasoning behind retreating to more defensible positions after the AFU started to fight back, it came with a widespread PR loss and forced us into a 3 year long war of attrition. In my opinion, if my ideas and visions had been implemented earlier, we could have sustained the offensives even after the catastrophic losses around Antonov and other sectors. By utilizing decentralized strategical command structures individuals units would have been able to act quickly against enemy movements."\n\nShoigu scoffed, and slowly glared at Gerasimov. "What do you think this is? America? Do you think we are fighting peasants in sandals? When facing a strong enemy, such as Ukraine and the collective NATO, you need a strong centralized command structure to make sure the front goes exactly as planned by those who know best. Individual units may outsmart peasants in sandals, but our enemies are not dumb, they are just as intelligent as us."\n\nGerasimov replied back "Oh come on, are you trying to say I am trying to americanize our forces? No I am simply trusting that the training and experience of our NCO's are adequate enough to make quick decisions in combat to ensure the completion of all the objectives, even if alternative routes take longer."\n\nShoigu "You're just delusional, you don't understand warfare! I trace my lineage back to the Soviet times! Excuse me." Shoigu caught himself as he let his emotions slip. Putin sighed and said..."
 SOV_sotnik.9.a: "Gerasimov is Right"
 SOV_sotnik.9.b: "Shoigu is Right"

 SOV_sotnik.10.t: "Post Wagner Mutiny Situation"
 SOV_sotnik.10.d: "The clock was nearing 9:30 at this point, and now the true point of debate came. The post 2023 mutiny situation, where the frontline situation appeared to be turning around. "My methods prove, it can do one thing the centralized model can't do as quickly. Adapt. As we decided to accept my doctrine more and more during the war, my decentralized assymetric methods had caused large attritional damage against the AFU. Individual units made decisions as we encircled Avdeevka in 2024, as there were communication hiccups."\n\n"However, it was the strategic reserve officers that planned everything out, which is the only reason we made any progress in the Donbass sector, detailed, centralized, strategic plans." Shoigu smirked, glancing over at his watch he stated "I suggest we move things along, I think we all have other appointments soon."\n\nGerasimov had much to say, but he knew Shoigu was right, things had to move along, so the decision was put back to Putin, which of the 2 actually turned things around."
 SOV_sotnik.10.a: "The Old Guard turned the tide"
 SOV_sotnik.10.b: "The Reformists turned it around"

 SOV_sotnik.11.t: "Sotnik 1.0 Kit"
 SOV_sotnik.11.d: "Placeholder"
 SOV_sotnik.11.a: "Perfect!"

 SOV_sotnik_news.1.t: "Vladimir Putin Announces Sotnik Program"
 SOV_sotnik_news.1.d: "What came as a surprise to many, on January 26th 2027 the Russian President Vladimir Putin had announced the "Sotnik Modernization Programme" while many thought with the Russian victory in Ukraine they would not bother much with large scale modernization and reform programs, it turns out that they were wrong. Learning from historical mistakes of being too confident and bold in themselves through victory, the Russian Ministry of Defence has written up a plan to reform the Russian Armed Forces beyond Ratnik-2. The reforms are stated to include both material and structural changes with some suspecting Putin will fold to Gerasimov and his reformists, who have gotten increasingly more powerful over the years, while others assume Putin will try to bend back to stabilizing societal norms and side with the Old Guard and Shoigu.\n\nLeonid Volkov and his liberal opposition based in Estonia have already condemned this act as "wasting the resources of the people" on the "Army of the Bear" signifying that while internal support remains high, Liberal opposition to Putin's administration remains firm\n\nWhilst unsure what will happen soon, one thing remains sure, the Russians don't plan on sitting still."
 SOV_sotnik_news.1.a: "The Russians Don't Sit Still"
 
 # Gerasimov Events
 SOV_gerasimov.1.t: "The Pragmatic Reformist"
 SOV_gerasimov.1.d: "It was a calm morning in Moscow, inside a luxurious building one man was sitting, his name? Valery Gerasimov, a well known Russian General, and the current Minister of Defence for the Russian Government, and while he was enjoying his usual large breakfast and luxuries one thing had constantly been piercing his mind. How to get the favour of the president, the Sotnik-1 Reforms have been drafted for a while now, and he was sure Putin would sign it, however one thing was bothering him. Sergei Shoigu and his Old Guardists, they would for sure try to block any attempt at integration of the Gerasimov Doctrine, holding massive political and military weight he had to play this smart. He was convinced he could not let the Russian Army stick in the same mud as the Soviets did, he knew he had widespread support from the VDV and Special Forces generals, however to convince Putin was another story.\n\nAs Gerasimov finished his meal he came to skim the plans for the Sotnik-1 reforms once more, it was perfect, the ideal plan to integrate his doctrine in the Armed Forces. As it reached 8:45 AM, his good friend  Colonel General Andrey Serdyukov came into the room. "General Gerasimov! It is time to get going, we still need to review the 331st Guards Airborne Regiment, it will be a long time traveling so let's get going." Gerasimov looked up at Serdyukov: "Understood Colonel General.""
 SOV_gerasimov.1.a: "To Kostroma!"

