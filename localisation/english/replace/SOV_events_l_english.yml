 # CSTO Stuff
 SOV_csto.1.t: "2027 CSTO Summit"
 SOV_csto.1.d: "It was a bright day in Astana, Kazakhstan, the Secretary General Tasmagambetov was giving a meeting, a lot of boring talks, numbers, preformance, but what stood out about this meeting is the great emphasis on Cohesion and the Drug Problems in Kazakhstan. Colonel General Andrey Serdyukov came back to Russia, keeping the proposals from the CSTO in mind, so he quickly met with Valery Gerasimov of the Ministry of Defense to discuss these issues.\n\n"General Gerasimov, we may have a problem, the recent statistics of the CSTO and Kazakhstan have not been positive, this alliance is falling apart and we need to do something about this, please inform the president and hand him this document, ive written a constructive plan for how we could increase the cohesion of the CSTO and make our Organization much stronger than before, the risk of Kazakh drug trades and terrorism is too high, and our Western border with NATO could be strengthened to." Gerasimov look at Sidorov and nodded. "Understood Colonel General. You are dismissed." \n\nGerasimov did not hesitate to inform President Putin about this, but kept in mind to use this as an advantage to further his reformist agenda, so Shoigu was not notified of the plans, Sidorov was a member of the Reformist faction in the Ministry of Defense, so this plan aligned quite well with Gerasimov's ideas to reform and modernize not only the Russian Armed Forces, but the whole of the CSTO. \n\nAs Putin read over the documents and plans, he took a quick glance at Gerasimov before signing the documents requested budget. "Make it happen." He said, before handing him the documents back and taking up the phone, he had a president to call."
 SOV_csto.1.a: "Understood"

