l_english:
  sp_event_SMO:0 "The Special Military Operation"
  sp_event_SMO_QUOTE:0 " Do you want decommunization? That is fine with us, but there is no need to stop halfway. We are ready to show you what real decommunization means–for Ukraine. \n- §YVladimir Putin§!"
  sp_event_SMO_REMARK:0 "Beginning..."
  sp_event_HRW:0 "Holy Reclaimation War"
  sp_event_HRW_QUOTE:0 "If the boot of a Russian soldier tramples our land, we will do everything so that the occupier pays dearly for it \n- §YDmytro Yarosh§!"
  sp_event_HRW_REMARK:0 "Another Brotherly War"
  sp_event_SEW:0 "Operation Sweeping East Wind II"
  sp_event_SEW_QUOTE:0 "No matter who tries to separate Taiwan from China in any form, the Chinese military will never agree to it and will show no mercy. \n- §OZhang Youxia§!"
  sp_event_SEW_REMARK:0 "Will This Be Another Failure?"
  sp_event_MOST:0 "March of Steel Torrent"
  sp_event_MOST_QUOTE:0 "We have the resolve, the confidence, and the ability to defeat separatist attempts for 'Taiwan independence' in any form. \n- §RXi Jinping§!"
  sp_event_MOST_REMARK:0 "Has He Gone Insane?"
  sp_event_NBP:0 "National Bolshevik Revolution!"
  sp_event_NBP_QUOTE:0 "Russia is Everything, the Rest is Nothing! \n- §gThe NBP§!"
  sp_event_NBP_REMARK:0 "Oh The Horror"
  sp_event_PTnD:0 "Putin's Death!"
  sp_event_PTnD_QUOTE:0 ""We are all mortal, and someday all of us will leave this world. It is inevitable." \n- §2Vladimir Putin§!"
  sp_event_PTnD_REMARK:0 "The Tsar Has Fallen."
  