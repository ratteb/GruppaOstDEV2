 ukraine.4.t:0 "Bucha Mall Incident!"
 ukraine.4.d:0 "It was a regular midday in Bucha, one of the richest neighbourhoods in Ukraine, the sun was shining slightly through the light clouds and people at the Bucha mall were going around, shopping, having fun, hanging out with their families, but what happened soon after was a horror no one expected. 4 Armed men entered the mall at 12:32 on the midday, wearing Ukrainian SBU uniforms and armed with fully automatic AK-74's and duffel bags full of weapons and ammo. As they calmly walked inside the mall, they raised their weapons, and opened fire on the crowds inside, a police officer attempted to pull his service pistol quickly, but was met with a fury of bullets and fire ripping his body apart from the inside.\n\n4 minutes later, the entire mall was empty with some lone survivors hiding in small rooms, under furniture and inside stores, but the casualties were immense and soon an entire army of police, SBU, and even the National Guard was outside wishing to engage the 4 unknown assailants. The terrorists quickly reloaded their rifles, before taking cover near the exit of the mall, where large armoured vehicle were awaiting them, making good cover for the armed security officers outside. And at 12:37 a large gunfight erupted, thousands of rounds were discharged in minutes from both sides, one of the terrorists got hit in the leg and attempted to retreat back to cover before he was quickly shot in the chest and fell. After 18 minutes more of fighting, moving, and the terrorists attempting to escape it came to a point a helicopter was nearing the roof.\n\nHowever, since it was a police helicopter the local security was unsure if this was reinforcements or their getaway, so erring on the side of caution no anti air defenses were engaged in shooting it down. Before 3 of the 4 terrorists climbed upon the roof, and entered the helicopter, shooting back at the security officers as they flew away. With 1 lone Anti Air missile missing the helicopter barely, they flew off, with a chase beginning soon, but ending upon simply, nothing. This day will change Ukraine. Forever."
 ukraine.4.b:0 "Oh the Horror!"
 ukraine.5.t:0 "SBU Report - 279"
 ukraine.5.d:0 "TO: IHOR PALYTSYA\nFROM: IHOR KALININ\n\nSUBJECT: SBU REPORT-279\n\nDear president, I am sure you are already aware of the news of the events that transpired at TTS Episentr recently. While it is a tragedy, we have no time to sit still and the SBU has done its utter best for an investigation. One of the 4 assailants has been eliminated in the firefight while we suffered no major casualties. The formerly mentioned Assailant was named 'Vasiliy Savchenko' a known member of the nationalist organisation 'Za Ukrayinsku Pravdu' he also held a manifesto of said organisation.\n\nNow I have received numerous emails from both the head of the National Guard and Police Departments with each of their plans to assess this situation. The National Guard wishes to announce the crisis as a National Crisis and commence Martial Law and Curfews, and allowing them to take over some civil and policing authorities in order to disband and destroy the organisation. While this would certainly mean a very effective response to them, it would also alienate our government and remind people of the troubling times of 2022.  And the Police Chief may not find this very pleasing to his authority.\n\nThe Police Department offered to keep a pragmatic approach but allow the PD to make use of heavy equipment and more funding in order to fight against this threat. While this would certainly reduce the effectiveness of our approach, it would make the police more loyal to us and even help in the fight against crime in the future. However this has the risk of not fully eliminating the group and a chance for them to return, even if unlikely we cannot suffer another blow.\n\nTo you is the choice Mr President.\n\nGreetings - Ihor Kalinin\n0 800 501 482"
 ukraine.5.a:0 "...The Offer From the PD"
 ukraine.5.b:0 "...The Offer From the NG"
