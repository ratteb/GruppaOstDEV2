 SOV_sotnik_decision_cat:0 "Sotnik Modernization Programme"
 SOV_sotnik_decision_cat_desc:0 "The Sotnik-1 Program was announced by Vladimir Putin on the 26th of January 2027 as the successor to the last Ratnik program. It is meant to fully finalize the basic Infantry Kit that was established in Ratnik, but also expand on the strategical and military errors seen in the Special Military Operation. It also has the objective of creating new and improved equipment, mainly meant for the VDV, Marine, and other Special Forces units. However, the Military Command also faces a tough challenge as they have to choose between continuing with Gerasimov's plan of Hybrid Warfare, which decentralizes the structure, or if they go to with and return to a fully conventional force, and centralize the system. Whatever they choose, it will forever decide the future of the Russian Army, and its fighting capabilities.\n\nBelow you will see a bar showing the progress of the reforms and what side you lean to."
