 SOV_nk_aid_decision_cat_desc:0 "§RNote to Player: This Does Not Have to be Rushed! Take your time and see where it leads!\n\n§!Ever since 1945, the Korean Peninsula has been split apart in 2 distinct states. The South, under a U.S backed capitalist dictatorship, and the North, under a Soviet backed communist dictatorship. Ever since 1950 the 2 countries have been in a state of war. While we may not share ideological values with the North, they have requested us for help and aid against their Southern neighbour. Therefore the Russian Federation sees it as imperative that we aid and support the Kim Regime to counter the West.\n\nOur current level of support to the DPRK is: [?SOV_NK_aid|0%%]"