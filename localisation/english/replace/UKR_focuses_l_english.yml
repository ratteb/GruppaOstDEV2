l_english:
 UKR_asses_the_situation:0 "Assess the Situation"
 UKR_asses_the_situation_desc:0 "As the new year rolls in Ukraine enters it, still with little improvements and what some would say is worse than before. Poverty has gone up, the insurgency raging within our borders has only worsened, with increasing military deaths and losses. Ukraine remains in a detrimental position, the economy is shattered and rebuilding efforts are slow, crime is up and the SBU and police is ineffective at fighting the internal threats of Ukraine."
