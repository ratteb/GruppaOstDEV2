 UKR_bucha_mall_incident:0 "TTS 'Episentr' Incident"
 UKR_pd_offer:0 "Offer from the PD"
 UKR_pd_offer_desc:0 "While the attacks were brutal, it is no more than what we already faced, seperatism, war with Russia, much more, the National Guard should maintain its duty at fighting against the Azovite insurgency and the police will be granted extended authority and measures to combat those behind the attack of the Episentr mall. While our response may be less effective, we reduce the fallout within the political sphere and international sphere. Ukraine must be seen as stable even amidst a crisis like this. Lord have mercy on Ukraine."
 UKR_heavy_equipment_for_pd:0 "Authorize Heavy Equipment for PD"
 UKR_sideline_ng:0 "Leave NG on Combat Duties"
