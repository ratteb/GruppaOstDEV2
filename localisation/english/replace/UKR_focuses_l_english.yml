 UKR_ng_offer:0 "Offer from the NG"
 UKR_ng_offer_desc:0 "This is not just a crisis, no, its more than that, after the attack and heavy casualties at the Episentr mall the government has no choice but to choose the National Guard to solve this, we must have a heavy handed approach against terrorism and activities like this. While our federal police forces may disagree, the president sees it necessary to employ the National Guard for this task, a heavily armed and militarized response is the only way to finally solve this. Therefore, the National Guard will have the full authority to commence police duties linked to the groups and people behind this. Long live Ukraine and its people."
