 NOV_equipment_decision_cat:0 "Russian Equipment Procurement"
 NOV_equipment_decision_cat_desc:0 "The Collective Security Treaty Organization is an intergovernmental military alliance based in Eurasia it has its roots in 1992 as the "Unified Armed Forces" but was later reformed in 2002 as the Collective Security Treaty Organization (CSTO). Although on paper the CSTO acts as a unified cohesive alliance, over the years, the alliance has began to fall apart with worsening co operation, and failures to abide by Article 4 of the CSTO.\n\nThe CSTO primarily focuses it's current tasks on Peacekeeping and Security Operations in central asia in current times, however after the 2027 summit in Kazakhstan, §CValery Gerasimov§! and the Chief of the Joint Staff of the CSTO have decided to convince the president of a 'Reform Plan' to make the CSTO more cohesive and stuck together. This is greatly hated by §GSergey Shoigu§! therefore a more cohesive CSTO means more power to §CGerasimov§!, and a less cohesive CSTO means more power to §GShoigu§!. A strong Cohesive CSTO will provide security benifits, and have a closer grip on the drug trades coming out of Central Asia, however expensive."
