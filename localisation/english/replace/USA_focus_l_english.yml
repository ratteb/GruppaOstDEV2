 USA_january_rally: "The January Rally"
 USA_january_rally_desc: "It’s been three years since Donald Trump began his second term, and now, in the final stretch of his presidency, he is determined to go out with a bang. To start the year, he has organized a massive rally in Washington D.C., to celebrate his administration's achievements. Thousands of his dedicated supporters gather inthe stadium and many outside and on the National Mall for the event, wearing MAGA hats and waving American flags. This year has started out to be one to remember it seems."

 USA_build_the_wall: "Finish the wall!"
 USA_build_the_wall_desc: "In 2016, Trump first promised us a Border wall. It still has yet to be fully completed and Trump has finally set out to complete it. The Border is 1,954 miles long while only 700 of those miles are covered by a wall. It is time to finish the Wall!"

 USA_1_more_year: "1 more year!"
 USA_1_more_year_desc: "Three years have passed since trumps inaugaration and his final year is here. This year is surely to be an important one. The president is sure to be implementing any last bits of policy and changes he wants done and keeping promises he made. Many MAGA supporters are happy with the last three years, and exicted to see the fourth. While Democrats are relieved Trump is on the out and hopeful for change in 2028."

