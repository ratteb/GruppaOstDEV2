 #Ukraine
 azof_insurgency01:0 "Severe Azov Insurgency"
 azof_insurgency01_desc:0 "The Azov Insurgency is severe"
 ineffective_sbu01:0 "Very Ineffective SBU"
 UKR_political_chaos01:0 "Political Chaos"
 UKR_political_chaos01_desc:0 "Our country's political sphere is nothing but utter chaos. People are fighting on the streets, our president is not that popular and reforms are desperately needed. We could reach out to Russia and risk a complete upheval of the country's political sphere. Or try to fix it on our own."
 UKR_political_chaos02:0 "Political Chaos"
 UKR_political_chaos03:0 "Political Chaos"
 UKR_demographics_crisis:0 "Demographics Crisis"
 UKR_ukraine_armed_forces:0 "Armed Forces of Ukraine"
 UKR_ukraine_armed_forces_desc:0 "\n\n\n\n£armed_forces_ukraine_texticon \n\n\n\n\n The Armed Forces of Ukraine was formed on the 6th of December 1991, tracing its lineage back to the 1910s and 1920s, it used to be one of the most powerful armies in Europe, up until the defeat of Ukraine in the Russo-Ukraine war in 2025,  afterwards, a large demobilization was to be conducted, leaving the army with only its most experienced. However, the major destruction of the military hardware, has left it with nothing but a shell of its former self. The Armed Forces is tasked with defending Ukraine from internal and external threats, however major issues have to be noted with corruption and unmotivated personnel. The Armed Forces however remembers its victories not only in 2014, but also in 2022, where they have emberassed an invader and proven capable of fighting for itself."

 #Russia 
 SOV_economic_stagnation01:0 "Economic Stagnation"
 SOV_economic_stagnation01_desc:0 "Maybe we should do something about this?"
 SOV_za_rodinu:0 "Za Rodinu!"
 SOV_za_rodinu_desc:0 "Slava Rossii! Our people in Novorossiya are liberated! Putin has led us to victory and the heroes on the front have proven us to be stronger than our enemies!"
 SOV_sotnik_program:0 "Sotnik Modernization Program"
 SOV_sotnik_program_desc:0 "The Sotnik-1 Program was announced by Vladimir Putin on the 26th of January 2027 as the successor to the last Ratnik program. It is meant to fully finalize the basic Infantry Kit that was established in Ratnik, but also expand on the strategical and military errors seen in the Special Military Operation. It also has the objective of creating new and improved equipment, mainly meant for the VDV, Marine, and other Special Forces units. However, the Military Command also faces a tough challenge as they have to choose between continuing with Gerasimov's plan of Hybrid Warfare, which decentralizes the structure, or if they go to with and return to a fully conventional force, and centralize the system. Whatever they choose, it will forever decide the future of the Russian Army, and its fighting capabilities."
 SOV_russian_armed_forces:0 "§RArmed Forces of the Russian Federation§!"
 SOV_russian_armed_forces_desc:0 "\n\n\n\n£sotnik1_program_texticon \n\n\n\n\n The Armed Forces of the Russian Federation, formed on the 7th of May 1992 as the direct successor of the Armed Forces of the Union of Soviet Socialist Republics is one of the most powerful military forces on the face of the earth. With major reforms having been initiated around 2014, with the first initiation of the Ratnik Modernization Program. The Armed Forces is tasked with defending Russia from any and all foreign threats, and is under direct command of the Ministry of Defense and the President of the Russian Federation. With old victories in Chechnya and Georgia, and more recent victories in Ukraine, the Russian Armed Forces is one of the strongest forces. But even with that, major issues still persist in the Armed Forces, corruption, nepotism, and unprofessionalism and a highly centralized structure make it difficult for operations to be successfully conducted. "
 SOV_demographics_crisis:0 "Demographics Crisis"
 SOV_demographics_crisis_desc:0 "Years of war, destruction and bad policies have led us to a great demographics crisis of low birth rates, and a dwindeling population. The recent Special Military Operation only made this much worse and drastic actions have to be taken against this major issue, lest we fall into a major labour shortage, and manpower shortage..."
 SOV_CSTO_leader:0 "CSTO Leader"
 SOV_SMO:0 "Special Anti-Terrorist Operation"
 SOV_EU_sanction:0 "EU Sanctions"
 SOV_US_sanction:0 "US Sanctions"

 # Russia laws
 russia_rosgvardia:0 "Rosgvardiya"
 russia_rosgvardia_desc:0 "The Rosgvardiya is the federal executive body of the Russian Federation responsible for law enforcement, internal security, counterterrorism, and riot control. It is led by §OViktor Zolotov§! it was created by presidential decree by President Vladimir Putin on the 5th of April 2016 by Presidential Decree, merging the old SOBR and OMON into 1 federal body."
 # Belarus
 BLR_CSTO_member01:0 "CSTO Member"
 BLR_batka_support:0 "The Batka"
 BLR_batka_support_desc:0 "The Batka, or as people outside of Belarus know him, President Lukashenko, the Batka is our founding stone, protecting us from the horrors of privitization in the 90s, and pushing us through the storms of the 2008 economic crisis, foreign agents, and at aiding those in the Russian world in 2014 and 2022. The Batka made a right choice by signing up to the Union State while emphasizing Belarussian independence. He kept our people safe in 2022 while still helping our Russian Brothers, due to his immense political expertise, he was able to avoid a war with the Ukrainians and keep the nation stable. However, the stability of the nation relies on the stability of Batka, if no one supports Batka, the nation falls apart, if Batka is not well, the nation falls apart. At all cost we must keep Batka in a good position, for a strong Belarus. "
 BLR_SVO:0 "Russian Invasion of Belarus"
 BLR_russian_sanctions:0 "Russian Sanctions"
 BLR_new_government:0 "New Belarusian Government"
 BLR_russian_independence:0 "Belarusian Anti Russian Spirit"
 BLR_anti_lukashenko_protests:0 "Anti Administration Protests"
 BLR_reliant_russia:0 "Russian Reliance"
 #Novorossiya
 azov_terror_bombing:0 "Azov Terror Bombing"
 azov_terror_bombing_desc:0 "The Azov Brigade, situated inside Ukraine has been terrorizing our civilian populations by sending consistent missile attacks on civilian areas, and the only way to stop it is to counter all missiles, complete the focus 'Russian Dome of Freedom' to get rid of this damn bombing!"
 NOV_azov_insurgency:0 "Azov Probing Attacks"
 NOV_azov_insurgency_desc:0 "The Azov Brigade frequently sends probing attacks into our borders, we must strengthen the Novorossiyan Defense Command to counter the probing attacks and stop them from ever terrorizing our populations again."
 NOV_defense_command:0 "§3Novorossiyan Defense Command§!"
 NOV_defense_command_desc:0 "The §3Novorossiyan Defense Command§! is a part of the Russian Armed Forced led by General Major Denis Sinenkov of the former militia forces, it is directly integrated with the Russian Armed Forces and its main goal is to protect the Novorossiyan People's Republic from outside attacks, making its main goal a defensive goal. It has been heavily involved with the fighting against Azov probing attacks and has already seen large successes. However it must be strengthened a little more with a trade off to offensive capabilities."
 NOV_russian_dome_of_freedom_construction:0 "Russian Dome of Freedom Construction"
 NOV_russian_dome_of_freedom_construction_desc:0 "We are construction large anti air facilities in order to face off any Ukrainian attacks by the Azov Brigada. We can end this madness once and for all."
 NOV_strengthen_the_novorossiyan_defense_command:0 "Strengthen the §3Novorossiyan Defense Command§!"
 NOV_defense_command01:0 "§3Novorossiyan Defense Command§!"
 NOV_defense_command01_desc:0 "The §3Novorossiyan Defense Command§! is a part of the Russian Armed Forced led by General Major Denis Sinenkov of the former militia forces, it is directly integrated with the Russian Armed Forces and its main goal is to protect the Novorossiyan People's Republic from outside attacks, making its main goal a defensive goal. It has been heavily involved with the fighting against Azov probing attacks and has already seen large successes. However it must be strengthened a little more with a trade off to offensive capabilities."
 NOV_za_novorossi:0 "Za Novorossii!"
 NOV_za_novorossi_desc:0 "Our victory has been achieved! It is time for the next part of our plan!"
 NOV_civil_governments_idea:0 "Civil Governments"

 # Transnistria 
 PMR_russian_peacekeepers:0 "Russian Peacekeepers in Prednistrovie"
 PMR_russian_peacekeepers_desc:0 "The Russian 14th Guards Army has been active in the region since 1994, since intervening against Moldovan aggression against our people Russia has sent these 1,200 peacekeepers to keep our territory safe. They provide training, reconnaissance and protection against the Moldovan threat."
 PMR_free_gas:0 "Free Gazprom Shipments"
 PMR_free_gas_desc:0 "Since 2005 the Russian State corporation Gazprom has provided us with free natural gas shipments. Which has heavily boosted our economy and energy sector, during the Special Military Operation there were hurdles in these shipments almost leading to our government collapsing. Yet in 2025 after the Minsk Peace Accords these gas shipments returned to full efficiency, effectively saving our government."
 PMR_ammo_depot:0 "Cobasna Ammunition Depot"
 PMR_ammo_depot_desc:0 "In Cobasna an old Ammunition Depot from Soviet times lies dormant, with an explosive potential of Nagasaki and Hiroshima combined, this depot is for now monitored by the Russian 14th Guards Army and Prednistrovian Military however if conflict were to occur here before taking care of this ammunition depot, the consequences would be severe. This depot also serves as a useful deterrent, even if it reduces the regional and especially local stability"
 # CHINA
 CHI_taiwan_crisis01:0 "Aftermath of Operation Sweeping East Wind"
 CHI_taiwan_crisis01_desc:0 "\n\n\n\n£CHI_taiwan_strait_crisis_texticon \n\n\n\n\nOperation Sweeping East Wind and what would internationally be called the Taiwan-Strait Crisis  2026 was proven to be an embarrassment to the PLAN and PLAAF, it proved that our lack of modern combat experience is not compensated for by our superior numbers and technology over the seperatists in Taiwan. President Xi Jinping and his Central Military Commission must take actions to show China and the PLA is not to be messed with. However how we deal with the issue is still a point of debate, either way, it was both a domestic and international embarrassment and we must reverse that sentiment, lest we face another century of humilation instead of a Chinese Century!\n\n§ROur Anger Will Not Go Unanswered!\nThe Chinese Century Will Come!\nOur Enemies Will Feel the Burn of our Flaming Sword!\nQianjin Zhonggou!§!"
 CHI_chinese_century_idea:0 "The Chinese Century"
 CHI_chinese_century_idea_desc:0 "\n\n\n\n£chinese_century_texticon \n\n\n\n\nIt is only logical that after the century of humiliation comes §tThe Chinese Century.§! A century of being used and abused is now over, and China will rise to be the greatest it has ever been, the 21st century, will be a Chinese Century. From the Qing, to the ideas to Sun Yat Sen, almost betrayed by the treacherous Kuomintang and the false "Republic of China" hiding on their little island in Taiwan. The People's Republic of China, under its exalted leadership of Xi Jinping will strive to be the only China, the greatest China there has ever been, from Mao, to Xi, this moment has awaited us, and it is time to fully realize the §tChinese Dream!§!"
 CHI_peoples_liberation_army:0 "People's Liberation Army"
 CHI_peoples_liberation_army_desc:0 "\n\n\n\n£peoples_liberation_army_texticon \n\n\n\n\nFounded in 1927, as the Chinese Workers' and Peasants' Red Army, it survived as that until 1947 where it was reformed as the People's Liberation Army, surviving the Long March and fighting against the Japanese onslaught and later the Kuomintang rebels, reformed and modernized tremendously by Mao Zedong and Deng Xiaoping the People's Liberation Army has survived harsh troubles, such as the Civil War, the Korean War, and the Sino-Vietnamese War. Under the current exalted president Xi Jinping the People's Liberation Army has undergone many reforms and modernizations, however the lack of modern combat knowledge is apparent, with the humiliating defeat in Operation Sweeping East WInd, the CMC has committed itself to modernizing the PLA to be better than ever. The main task of the PLA is to defend the People's Republic of China from internal and external threats, it is currently headed by general Zhang Youxia and general Zhang Shengmin.\n\nStanding at 2,035,000 active personnel and 510,000 reservists the PLA stands as the single largest military in the world, with a large arsenal of modern weapon systems, aircraft and warships. It also has a sizeable arsenal of nuclear weapons and the second largest military budget in the world."
 
 # Taiwan 
 ROC_taiwan_crisis01:0 "Aftermath of the Strait Crisis"
 ROC_taiwan_crisis01_desc:0 "When China launched their Operation Sweeping East Wind to provoke one of our ships and air defence systems to provoke us, we strode well defending ourselves, shooting down numerous Chinese aircraft and even sinking a whole Chinese ship, although parked and unmanned, it has shown our resolve and provided confidence in our abilities from our Allies abroad. Although the Kuomintang has told us we have provoked the bear, we simply saw this as defending ourselves."
 #Belgium
 BEL_flemish_militants06:0 "Flemish Militants"
 BEL_flemish_militants06_desc:0 "The Flemish Militants is an umbrella term for multiple militant groups wishing for an independent Flanders and a resistance against Belgium. They only grew larger with our efforts to lower their influence through censorship and propaganda."
 
 # DPRK
 KOR_juche_policy:0 "Juche Policy"
 KOR_juche_policy_desc:0 "Juche, the core ideology of the DPRK, it is an emphasis on self-reliance, the individual, the nation state, and national sovereignty. Forged by dear leader Kim il-Sung, and reformed by Kim Jong-il it stands as its own seperate ideology from revisionist marxism seen in both the Soviet Union and modern day China, albeit still friendly towards those regimes. It is the constant struggle for independence on all fronts. Therefore with the dear leadership of Kim Jong-Un the Juche idea continues to strive forward. To a prosperous utopia!"
 KOR_songun_policy:0 "Songun Policy"
 KOR_songun_policy_desc:0 ""Songun" or Military-First was first implemented in 1995 by dear general Kim Jong-Il in order to further counter the destructive tendencies of capitalism and the degenerative west! It is the secondary ideology of the DPRK and to this remains that the military is above all. Concerning that this elevates the brave KPA to the primary position within the WPK and guides both our domestic and international actions. Dear Leader Kim Jong-Un has continued to strive for Songun and elevate its importance in Korean society!"
 KOR_korean_peoples_army:0 "Korean People's Army"
 KOR_korean_peoples_army_desc:0 "\n\n\n\n£korean_peoples_army_texticon \n\n\n\n\n the Korean People's Army or KPA traces its lineage back to the 1930s where it fought against the brutal Japanese occupation as the Korean Volunteer Army, it was then headed by Dear Generalissimo Kim Il-Sung and was later reformed in 1948 as The Korean People's Army instead on June 25th 1950 the dear Generalissimo decided to ensue his attempt to liberate the occupied South by launching the Fatherland Liberation War and commenced a surprise attack on the South. The U.S ruthlessly responded and we were destroyed as a society, Kim Il-Sung later imposed Songun in order to rebuild the might of the KPA and surpass the south, when he passed away in 1994, his son, Dear Generalissimo Kim Jong-Il continued the creation of the KPA, and under the current Dear Leader Kim Jong-Un, the Army has modernized and reformed significantly, with aid from our Chinese and Russian brothers we will surely be ready to fight against the south once more!\n\nThe KPA is considered the second largest military organization in the world with 1,320,000 active military personnell and 500,000 more in our reserves, with a 26% of our GDP being spent on the military. We also possess a nuclear arsenal, which makes us a threat to the whole capitalist world!"
 KOR_economic_situation:0 "North Korean Economy"

#USA
 USA_american_armed_forces:0 "§7United States Armed Forces"
 USA_american_armed_forces_desc:0 "\n\n\n\n£american_armed_forces_texticon \n\n\n\n\n The §7U.S. Armed Forces§! date back to the creation of the Continental Army in 1775, as well as the Continental Navy and Marines in October and November of the same year, respectively. The Armed Forces faced a trial by fire in the Revolutionary War fighting against the most powerful empire in the world at that time, The British Empire. Under the leadership of the great George Washington the Continental Army beat back the British after 8 long years and firmly secured American independence. Since, the Armed Forces have participated in many conflicts including both world wars. The Second World War was another test and it ended with the establishment of America as a global super power. We fought a two front war beating the Japanese and Germans with our allied nations. Since 1949, all of the armed forces, except the Coast Guard, are a part of the Department of War including the Space Force which President Trump created in 2019 during his first term. Currently, the military stands at 1,330,000 active personnel with an additional 800,000 in reserve. Our Armed Forces stand ready to continue the defense of the nation and stay steadfast in its duties. We are the sole world §RSuper Power§! able to conduct operations across the globe."
 USA_the_second_amendment:0 "The Second Amendment"